<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sample Webpage</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph of text -->
    <p>This is a sample paragraph showing how text looks on a basic HTML page.</p>

    <!-- Hyperlink -->
    <p>You can visit <a href="https://www.w3schools.com" target="_blank">W3Schools</a> to learn more about coding.</p>

    <!-- Ordered List -->
    <h3>My Favorite Fruits</h3>
    <ol>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ol>

    <!-- Image Example (Replace URL with your own image) -->
    <h3>Sample Image</h3>
    <img src="https://placeholder.com" alt="Placeholder Image" width="150" height="150">

</body>
</html>
